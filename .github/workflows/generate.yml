name: Generate Timelapse

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: 'Start date (YYYY-MM-DD). Defaults to first day of current month.'
        required: false
        default: ''
      date_to:
        description: 'End date (YYYY-MM-DD). Defaults to today.'
        required: false
        default: ''
      fps:
        description: 'Frames per second for the output video.'
        required: false
        default: '24'
      output:
        description: 'Output filename (e.g. timelapse_april.mp4). Auto-generated if blank.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # large timelapses with many frames can take a while

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Cache verified FFmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/ffmpeg
          key: ffmpeg-linux-x64-n8.1.2-47-g156bb4d299-90f0f2d8326a

      - name: Set up verified FFmpeg
        run: |
          bash .github/scripts/setup-ffmpeg-linux.sh
          echo "$GITHUB_WORKSPACE/.cache/ffmpeg" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Generate timelapse
        id: generate
        env:
          INPUT_DATE_FROM: ${{ inputs.date_from }}
          INPUT_DATE_TO: ${{ inputs.date_to }}
          INPUT_FPS: ${{ inputs.fps }}
          INPUT_OUTPUT: ${{ inputs.output }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          args=()
          if [[ -n "$INPUT_DATE_FROM" ]]; then args+=(--date-from "$INPUT_DATE_FROM"); fi
          if [[ -n "$INPUT_DATE_TO" ]]; then args+=(--date-to "$INPUT_DATE_TO"); fi
          if [[ -n "$INPUT_FPS" ]]; then args+=(--fps "$INPUT_FPS"); fi
          if [[ -n "$INPUT_OUTPUT" ]]; then args+=(--output "$INPUT_OUTPUT"); fi
          python scripts/generate.py "${args[@]}"

      - name: Upload video as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: timelapse
          path: ${{ steps.generate.outputs.video_path }}
          if-no-files-found: warn
