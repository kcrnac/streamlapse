name: Capture Frame

on:
  # Cloudflare Cron Triggers dispatch this workflow. Keep workflow_dispatch so
  # the Worker, API clients, and manual tests can all invoke the same workflow.
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass work-hours check (useful for testing outside work hours)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Capture and upload frame
        env:
          CAPTURE_FORCE: ${{ inputs.force }}
          STREAM_URL: ${{ secrets.STREAM_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python scripts/capture.py
