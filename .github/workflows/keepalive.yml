name: Keepalive

on:
  schedule:
    # Runs monthly, well within GitHub's 60-day inactivity window that
    # auto-disables scheduled workflows (like capture.yml).
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record keepalive timestamp
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/.keepalive

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- .github/.keepalive; then
            git add .github/.keepalive
            git commit -m "chore: keepalive to prevent scheduled workflow disable"
            git push
          fi
