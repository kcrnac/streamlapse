name: Keepalive

on:
  schedule:
    # Run twice monthly, offset from high-load hour boundaries.
    # Each successful run creates repository activity well within GitHub's
    # 60-day inactivity window for scheduled workflows.
    - cron: '13 3 1,15 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Record keepalive timestamp
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/.keepalive

      - name: Commit and push
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/.keepalive
          git commit -m "chore: refresh workflow keepalive"
          git push origin "HEAD:${DEFAULT_BRANCH}"
